<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="星渊世界 - 公告列表">
  <title>公告 - 星渊世界</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-notices">

  <!-- 顶部导航栏（与首页一致） -->
  <header class="site-header">
    <div class="header-left">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="打开菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" class="icon"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <a href="index.html" class="logo">星渊世界</a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="在「星渊世界」中搜索" autocomplete="off">
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="themeToggle" aria-label="切换深浅模式" title="切换深浅模式">
        <svg viewBox="0 0 24 24" class="icon icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" class="icon icon-sun"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <!-- 左侧边栏（与首页一致，导航由 assets/data/nav.js 渲染） -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 公告列表区 -->
    <main class="content">
      <section class="notice-page">
        <h1 class="page-title">公告</h1>
        <ul class="list notice-list" id="noticeList"><!-- 全部公告由 assets/data/notice.js 渲染 --></ul>
      </section>
    </main>
  </div>

  <script src="assets/data/nav.js"></script>
  <script src="assets/data/notice.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
